[project]
name = "fesnyng-backend"
version = "0.1.0"
description = "Fesnyng control-plane and agent-host foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "mcp==2.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "ty==0.0.80",
]

[build-system]
requires = ["uv_build==0.6.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
